<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fork.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Montserrat plus Playfair Display, Raleway, Inter fonts for stylish options -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Playfair+Display&family=Raleway&family=Inter&display=swap" rel="stylesheet" />
    <title>Friends Lounge Mbaise</title>

    <!-- Standard description - also used by search engines -->
    <meta name="description" content="Friends' Lounge Mbaise - Making Friends & Building Communities. Order food, book a table, or book your next event at Umuofor-Udo's favourite lounge." />

    <!-- Open Graph - what WhatsApp, Facebook, and most link-preview tools read -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Friends Lounge Mbaise" />
    <meta property="og:title" content="Friends Lounge Mbaise" />
    <meta property="og:description" content="Making Friends & Building Communities. Order food, book a table, or book your next event at Umuofor-Udo's favourite lounge." />
    <meta property="og:url" content="https://friendsloungembaise.com/" />
    <meta property="og:image" content="https://friendsloungembaise.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card - some apps read this instead of/alongside Open Graph -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Friends Lounge Mbaise" />
    <meta name="twitter:description" content="Making Friends & Building Communities. Order food, book a table, or book your next event at Umuofor-Udo's favourite lounge." />
    <meta name="twitter:image" content="https://friendsloungembaise.com/og-image.jpg" />

    <!-- Google Analytics 4. Set VITE_GA_MEASUREMENT_ID in .env to activate -
         if it's blank, this loads harmlessly with nothing to track.
         send_page_view is off here deliberately: this is a single-page app,
         so a plain GA4 snippet would only ever see the first page load, not
         in-app navigation between Home/ProgramsHub/Friends/Mbaise/Projects.
         Page views are instead fired manually on each route change - see
         the route-tracking logic in src/App.jsx. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "%VITE_GA_MEASUREMENT_ID%", { send_page_view: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
